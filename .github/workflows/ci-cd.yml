# Pull requests: typecheck, test, build and synthesize both stages (with cdk-nag).
# Pushes to main: the same checks, then deploy the dev stage with the exact app that
# was synthesized, post the prod diff in the run summary, and deploy prod once a
# reviewer approves the `production` environment (leave it waiting or reject it to
# keep that commit out of prod).
# Run workflow (main) redeploys one stage without a new commit: dev, or prod after
# its diff and the approval.
# AWS access is through GitHub OIDC: no keys are stored in GitHub. The role comes
# from backend/lib/github-ci-stack.ts.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    # Docs-only changes (README, docs/ including the deck) don't redeploy.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      target:
        description: Stage to redeploy (prod waits for approval after its diff)
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::297580066575:role/bio-majesty-github-deploy

# A new push to a pull request cancels its older run. Runs on main don't wait for each
# other (a prod deploy can sit waiting for approval); their deploy jobs queue per stage
# instead, so a deploy is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build, synth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the frontend
        run: npm run build
      - name: Synthesize with cdk-nag security checks
        run: npm run synth
      - name: Synthesize the prod stage
        run: npm run synth:prod -w backend -- --output cdk.out.prod
      - name: Keep the synthesized apps for the deploy jobs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: cdk-out
          path: |
            backend/cdk.out
            backend/cdk.out.prod
          retention-days: 1

  deploy:
    name: Deploy (dev)
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One dev deploy at a time; a newer one waiting replaces an older one that hasn't started.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the CDK CLI
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cdk-out
          path: backend
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        working-directory: backend
        run: npx cdk deploy --app cdk.out --all --require-approval never --outputs-file cdk-outputs.json
      - name: Check the dashboard is up
        working-directory: backend
        run: |
          url=$(jq -r '[.[] | .DashboardUrl | select(.)] | first' cdk-outputs.json)
          curl -fsS --retry 3 -o /dev/null "$url/"
          curl -fsS --retry 3 "$url/config.json" | jq -e '.apiUrl' > /dev/null
          echo "Deployed ${GITHUB_SHA::7} to $url" >> "$GITHUB_STEP_SUMMARY"

  diff-prod:
    name: Diff (prod)
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the CDK CLI
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cdk-out
          path: backend
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Compares templates only (no change set), so this job changes nothing in AWS.
      - name: Diff against the deployed prod stack
        working-directory: backend
        run: |
          npx cdk diff --app cdk.out.prod --all --no-change-set --no-color 2>&1 | tee diff.txt
          {
            echo "### Prod changes in ${GITHUB_SHA::7}"
            echo "Approve the \`production\` deployment to apply them."
            echo '```diff'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy (prod)
    # After a push, prod only follows a successful dev deploy.
    needs: [diff-prod, deploy]
    if: ${{ !cancelled() && needs.diff-prod.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One prod deploy at a time: while one waits for approval, the newest later one queues
    # behind it (approve or reject the older one first).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    # Waits for a required reviewer; deployment branches are limited to main in the environment settings.
    environment:
      name: production
      url: ${{ steps.check.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the CDK CLI
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cdk-out
          path: backend
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        working-directory: backend
        run: npx cdk deploy --app cdk.out.prod --all --require-approval never --outputs-file cdk-outputs.json
      - name: Check the dashboard is up
        id: check
        working-directory: backend
        # Checks the CloudFront address, which answers before (and without) the custom domain's DNS record.
        run: |
          url=$(jq -r '[.[] | .DashboardUrl | select(.)] | first' cdk-outputs.json)
          cdn=$(jq -r '[.[] | .DashboardDnsTarget // empty | "https://\(.)"] | first // empty' cdk-outputs.json)
          curl -fsS --retry 3 -o /dev/null "${cdn:-$url}/"
          curl -fsS --retry 3 "${cdn:-$url}/config.json" | jq -e '.apiUrl' > /dev/null
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${GITHUB_SHA::7} to $url" >> "$GITHUB_STEP_SUMMARY"
